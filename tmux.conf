# Improve terminfo compatibility (xterm mouse/capability override for Tc)
set-option -sa terminal-overrides ",xterm*:Tc"

# Change prefix from default C-b to C-s, and unbind default
unbind C-b
set -g prefix C-s

# Disable tmux mouse support (WezTerm/mouse bindings handled elsewhere)
set -g mouse off

# Put status bar at the top
set -g status-position top

# Use 1-based numbering for windows and panes (instead of tmux default 0-based)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Renumber windows automatically when windows are closed
set-option -g renumber-windows on

# Tmux Plugin Manager install path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Catppuccin theme settings
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Status bar layout lengths
set -g status-right-length 100
set -g status-left-length 100

# Clear left side; build right side using catppuccin status segments
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Wayland clipboard integration (copy/paste helpers)
set -g @clipboard-copy 'wl-copy'
set -g @clipboard-paste 'wl-paste'

# --- Copy-mode: copy selection to BOTH clipboard and PRIMARY (via wl-copy -p) ---
# PRIMARY is set with: wl-copy -p
unbind -T copy-mode-vi y
unbind -T copy-mode-vi Enter
unbind -T copy-mode y
unbind -T copy-mode Enter

# When exiting copy mode after selecting (vi-mode keys), pipe selection to:
# - wl-copy (CLIPBOARD)
# - wl-copy -p (PRIMARY)
bind-key -T copy-mode-vi y     send -X copy-pipe-and-cancel "wl-copy --foreground --trim-newline; wl-copy -p --foreground --trim-newline"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy --foreground --trim-newline; wl-copy -p --foreground --trim-newline"
bind-key -T copy-mode y        send -X copy-pipe-and-cancel "wl-copy --foreground --trim-newline; wl-copy -p --foreground --trim-newline"
bind-key -T copy-mode Enter    send -X copy-pipe-and-cancel "wl-copy --foreground --trim-newline; wl-copy -p --foreground --trim-newline"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
